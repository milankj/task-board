<div class="confirmation-modal-container">
    <div mat-dialog-title class="modal-header">
        <h2 class="modal-title">{{ data?.title || 'Confirm Action' }}</h2>
    </div>

    <mat-dialog-content class="modal-content">
        <p class="modal-message">{{ data?.message || 'Are you sure you want to proceed?' }}</p>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="modal-actions">
        <button mat-button type="button" (click)="onCancel()">
            {{ data?.cancelText || 'No' }}
        </button>
        <button mat-flat-button [color]="data?.confirmColor || 'warn'" type="button" (click)="onConfirm()">
            {{ data?.confirmText || 'Yes' }}
        </button>
    </mat-dialog-actions>
</div>
